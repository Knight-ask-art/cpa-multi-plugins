name: Build & Release Plugins

on:
  push:
    tags:
      - 'v*'
    # Deep-audit A2 fix (v0.12.76): also run CI on main pushes so the branch
    # badge reflects reality (previously the latest main-ref run was a
    # cancelled dispatch, rendering the badge permanently "failing" while
    # tag runs were green for 76+ consecutive releases).
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0-dev'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            ext: so
          # NOTE: darwin-amd64 used to ride the retired macos-13 Intel hosted
          # runners (they queued forever and blocked the release job via
          # needs: build). issue #7 brings the asset back as a CROSS build on
          # the arm64 runner: Apple's clang accepts -arch x86_64 on Apple
          # Silicon and the Go cgo toolchain drives it via CC. optional:true
          # keeps a toolchain regression from blocking the other four assets.
          - os: darwin
            arch: amd64
            runner: macos-14
            goos: darwin
            goarch: amd64
            cc: "clang -arch x86_64"
            ext: dylib
            optional: true
          - os: darwin
            arch: arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: mingw-w64-x86_64-gcc
            ext: dll
    continue-on-error: ${{ matrix.optional || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Set up MSYS2 (Windows only)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
          path-type: inherit

      - name: Build all plugins (Windows)
        if: matrix.os == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: gcc
        run: |
          which gcc 2>&1 || echo "which gcc failed"
          gcc --version 2>&1 | head -1 || echo "gcc invocation failed"
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          PLUGINS="zcode"
          for plugin in $PLUGINS; do
            echo "=== Building $plugin ==="
            cd plugins/$plugin
            go mod download
            VER="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
            VFLAG=""
            [ -n "$VER" ] && VFLAG="-X main.version=$VER"
            OUTPUT="../../dist/${{ matrix.os }}-${{ matrix.arch }}/${plugin}.${{ matrix.ext }}"
            go build -buildmode=c-shared -trimpath -ldflags="-s -w $VFLAG" -o "$OUTPUT" .
            if [ $? -eq 0 ]; then
              echo "  ✅ $plugin built"
            else
              echo "  ❌ $plugin failed"
              exit 1
            fi
            cd ../..
          done
        shell: msys2 {0}

      - name: Build all plugins (non-Windows)
        if: matrix.os != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          PLUGINS="zcode"
          for plugin in $PLUGINS; do
            echo "=== Building $plugin ==="
            cd plugins/$plugin
            go mod download
            VER="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
            VFLAG=""
            [ -n "$VER" ] && VFLAG="-X main.version=$VER"
            OUTPUT="../../dist/${{ matrix.os }}-${{ matrix.arch }}/${plugin}.${{ matrix.ext }}"
            go build -buildmode=c-shared -trimpath -ldflags="-s -w $VFLAG" -o "$OUTPUT" .
            if [ $? -eq 0 ]; then
              echo "  ✅ $plugin built"
            else
              echo "  ❌ $plugin failed"
              exit 1
            fi
            cd ../..
          done
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          Get-ChildItem dist/${{ matrix.os }}-${{ matrix.arch }} -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
          Compress-Archive -Path "dist/${{ matrix.os }}-${{ matrix.arch }}/*.dll" -DestinationPath "cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force
          Write-Host "Created zip:"
          Get-Item "cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip" | Select-Object Name, Length

      - name: Package artifacts (non-Windows)
        if: matrix.os != 'windows'
        run: |
          cd dist/${{ matrix.os }}-${{ matrix.arch }}
          rm -f *.h
          zip -r ../../cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip .
          cd ../..
          ls -lh cpa-multi-plugins*.zip
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}
          path: cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}.zip
          retention-days: 30

  # Fork addition: upstream only BUILDS, so a broken test suite would still ship
  # an artifact. This fork's zcode plugin carries a real suite, and the release
  # job waits on it.
  test:
    name: Test zcode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      # .gitattributes pins eol=lf, so a CRLF checkout cannot silently make every
      # file "unformatted" here -- if this fails it is a real formatting miss.
      - name: gofmt
        working-directory: plugins/zcode
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # CGO_ENABLED=1 is load-bearing: main.go is the only file importing "C",
      # and with CGO disabled it is silently excluded from the build.
      - name: go vet
        working-directory: plugins/zcode
        env:
          CGO_ENABLED: 1
        run: |
          go mod download
          go vet ./...

      - name: go test
        working-directory: plugins/zcode
        env:
          CGO_ENABLED: 1
        run: go test -count=1 ./...

  release:
    name: Create Release
    needs: [build, test]
    runs-on: ubuntu-latest
    # Deep-audit hardening: publish only when the build job itself succeeded.
    # The optional darwin-amd64 cross leg keeps reporting success via
    # continue-on-error, so a toolchain regression there still cannot block a
    # release -- but a REQUIRED leg failing now skips the release instead of
    # silently shipping an incomplete asset set.
    # v0.12.76: tag-gated as well — main-branch CI runs (badge refresh) must
    # build but NEVER publish. workflow_dispatch keeps its version input path.
    if: always() && !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: cpa-multi-plugins ${{ steps.version.outputs.version }}
          body: |
            # cpa-multi-plugins ${{ steps.version.outputs.version }}

            **Fork** of [mmqz/cpa-multi-plugins](https://github.com/mmqz/cpa-multi-plugins), trimmed to one plugin:
            **zcode** (GLM coding plan). The other four plugins are still in the tree but are not built here —
            see `.github/workflows/release.yml`.

            Build gate: `gofmt` + `go vet` + `go test` must pass before anything publishes.

            ## Downloads
            - `cpa-multi-plugins-linux-amd64.zip` — Linux x86_64
            - `cpa-multi-plugins-linux-arm64.zip` — Linux ARM64
            - `cpa-multi-plugins-darwin-arm64.zip` — macOS Apple Silicon
            - `cpa-multi-plugins-darwin-amd64.zip` — macOS Intel (cross-built on an arm64 runner)
            - `cpa-multi-plugins-windows-amd64.zip` — Windows x86_64

            ## Installation
            1. Download and unzip the archive for your platform.
            2. Copy `zcode.so` / `zcode.dylib` / `zcode.dll` into your CPA plugins directory.
            3. **Enable it explicitly** in `config.yaml` (the per-plugin default is disabled):
               ```yaml
               plugins:
                 enabled: true
                 dir: "plugins"
                 configs:
                   zcode: { enabled: true }
               ```
            4. Restart CPA and check the log for `pluginhost: plugin registered plugin_id=zcode`.
            5. Log in via the management panel or the Management API. A legacy single-file `zcode.json` is adopted automatically.
          files: release/*.zip
          draft: false
          prerelease: false
